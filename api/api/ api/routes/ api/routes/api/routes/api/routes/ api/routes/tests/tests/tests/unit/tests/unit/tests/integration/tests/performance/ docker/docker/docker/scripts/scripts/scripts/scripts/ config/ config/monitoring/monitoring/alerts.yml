groups:
  - name: bci_alerts
    rules:
      - alert: HighLatency
        expr: processing_latency_seconds > 0.02
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "High processing latency"
          description: "Processing latency is above 20ms for more than 1 minute"
      
      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High error rate"
          description: "Error rate is above 5% for the last 5 minutes"
      
      - alert: HighMemoryUsage
        expr: memory_usage_bytes > 512 * 1024 * 1024
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage"
          description: "Memory usage is above 512MB for more than 5 minutes"
      
      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Service is down"
          description: "API service has been down for more than 1 minute"
