[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bci-artifact-rejection"
version = "2.0.0"
description = "AI-powered EEG artifact rejection API for BCI applications"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
keywords = ["eeg", "bci", "artifact-rejection", "machine-learning", "neuroscience"]

[project.urls]
Homepage = "https://github.com/yourusername/bci-artifact-rejection-api"
Repository = "https://github.com/yourusername/bci-artifact-rejection-api"
Issues = "https://github.com/yourusername/bci-artifact-rejection-api/issues"

[tool.black]
line-length = 100
target-version = ['py310']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = [
    "tests",
]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
